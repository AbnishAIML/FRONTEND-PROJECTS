<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRUM</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>🎵 INDIAN MUSIC STUDIO</h1>
    <p>SA RE GA MA PA DHA NI SA</p>

    <div class="music-board">

        <div class="music-key" data-note="Sa">
            <kbd>1</kbd>
            <span>SA</span>
        </div>

        <div class="music-key" data-note="Re">
            <kbd>2</kbd>
            <span>RE</span>
        </div>

        <div class="music-key" data-note="Ga">
            <kbd>3</kbd>
            <span>GA</span>
        </div>

        <div class="music-key" data-note="Ma">
            <kbd>4</kbd>
            <span>MA</span>
        </div>

        <div class="music-key" data-note="Pa">
            <kbd>5</kbd>
            <span>PA</span>
        </div>

        <div class="music-key" data-note="Dha">
            <kbd>6</kbd>
            <span>DHA</span>
        </div>

        <div class="music-key" data-note="Ni">
            <kbd>7</kbd>
            <span>NI</span>
        </div>

        <div class="music-key" data-note="Sa2">
            <kbd>8</kbd>
            <span>SA</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
