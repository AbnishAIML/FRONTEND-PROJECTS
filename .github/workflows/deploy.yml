
name: Deploy DRUM Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify Website Files
        run: |
          ls -la DRUM
          test -f DRUM/index.html

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: DRUM

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
